[package]
name = "skillarena-tournament"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.17.2", features = ["legacy"] }
borsh = "1.0.0"
schemars = "0.8.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
